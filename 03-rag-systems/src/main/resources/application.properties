spring.application.name=rag-systems

# Mesmas variáveis de ambiente do projeto 02
rag.provider=${LLM_PROVIDER:simulado}
rag.api-key=${ANTHROPIC_API_KEY:}

# Use o mesmo nome de modelo que você usou no projeto 02
rag.model=claude-sonnet-5-5

# Tamanho máximo de cada trecho (em letras) e quantos trechos entram na resposta
rag.chunk-size=600
rag.top-k=3
