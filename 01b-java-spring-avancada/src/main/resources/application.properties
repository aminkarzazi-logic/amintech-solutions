spring.application.name=spring-avancada
server.port=8080

# Banco de dados H2: fica na memoria e zera toda vez que o programa reinicia
spring.datasource.url=jdbc:h2:mem:amintech
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console visual do banco: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Cria as tabelas sozinho a partir das classes @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
