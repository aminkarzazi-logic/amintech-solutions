spring.application.name=llm-integrations
server.port=8080

# Provedor: "simulado" (sem chave e sem custo) ou "anthropic" (chama a API de verdade).
# O valor vem da variavel de ambiente LLM_PROVIDER; se ela nao existir, usa "simulado".
llm.provider=${LLM_PROVIDER:simulado}

# Nome do modelo e limite de tokens da resposta
llm.model=${LLM_MODEL:claude-haiku-5-5}
llm.max-tokens=500

# A chave de API NUNCA fica neste arquivo: ela vem da variavel de ambiente ANTHROPIC_API_KEY.
llm.api-key=${ANTHROPIC_API_KEY:}

# Tempo maximo de espera ao chamar a API (modelos podem demorar alguns segundos)
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=60s
